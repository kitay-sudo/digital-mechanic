# Запуск всего продукта одной командой:  docker compose up --build
# Материалы заказчика (PDF руководств, данные заглушек) в Git не входят. Перед первым запуском
# задайте MATERIALS_URL в .env и скачайте их, индекс соберётся там же (см. README):
#   docker compose build
#   docker compose run --rm --no-deps backend uv run --no-dev python -m app.materials
services:
  mock-ml:
    build: ./mocks
    command: uvicorn mock_ml.app:app --host 0.0.0.0 --port 8001
    volumes:
      - ./mocks/data:/srv/data:ro   # данные заглушек, скачиваются по MATERIALS_URL
    restart: unless-stopped

  mock-toir:
    build: ./mocks
    command: uvicorn mock_toir.app:app --host 0.0.0.0 --port 8002
    volumes:
      - ./mocks/data:/srv/data:ro
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Чтобы контейнер видел сервер локальной модели на этой же машине (LLM_BASE_URL=http://host.docker.internal:…)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      # Адреса внешних сервисов (F6 ТЗ). Чтобы подключить рабочие сервисы, задайте их в .env.
      MOCK_ML_URL: ${MOCK_ML_URL:-http://mock-ml:8001}
      MOCK_TOIR_URL: ${MOCK_TOIR_URL:-http://mock-toir:8002}
    volumes:
      - ./knowledge:/knowledge           # PDF руководств и индекс, в Git не входят
      - ./mocks/data:/srv/mocks/data     # карточки машин из материалов заказчика, в Git не входят
      - ./data:/data                     # чат, заявки, журнал стоимости
    depends_on: [mock-ml, mock-toir]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  # MCP-коннектор: инструменты агента для внешних ИИ-ассистентов (docs/mcp.md). Ключи — в .env (MCP_*)
  mcp:
    build: ./mcp-server
    env_file:
      - path: .env
        required: false
    environment:
      MCP_BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports:
      - "${MCP_PORT:-8200}:8200"
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
