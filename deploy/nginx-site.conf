# Стенд за уже работающим nginx (когда порты 80 и 443 заняты другими сайтами). Интерфейс слушает только 127.0.0.1:3000
# (FRONTEND_PORT=127.0.0.1:3000 в .env). Положить в /etc/nginx/sites-available, включить ссылкой в sites-enabled,
# nginx -t && systemctl reload nginx.
# Сертификат: certbot --nginx -d digital-mechanic.ru (когда домен заработает) допишет блок 443 и перенаправление.
server {
    listen 80;
    server_name digital-mechanic.ru www.digital-mechanic.ru;

    # Фото узла (до трёх по 6 МБ) и записи голоса
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Ход агента приходит потоком событий: без буферизации механик видит шаги сразу
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
