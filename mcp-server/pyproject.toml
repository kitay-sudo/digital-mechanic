[project]
name = "digital-mechanic-mcp"
version = "0.1.0"
description = "MCP-коннектор «Цифрового механика»: инструменты агента для внешних ИИ-ассистентов"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
