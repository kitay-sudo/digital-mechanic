[project]
name = "digital-mechanic-backend"
version = "0.1.0"
description = "AI-агент «Цифровой механик»: сервер"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "snowballstemmer>=2.2",
    "anthropic>=0.60",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
